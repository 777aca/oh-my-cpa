services:
  oh-my-cpa:
    image: wiziscool/oh-my-cpa:v0.4.3
    container_name: oh-my-cpa-trial
    user: '10001:10001'
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - '127.0.0.1:18317:8080'
    environment:
      TZ: ${TZ:-UTC}
      OMCPA_BASE_PATH: /omc
      OMCPA_DATA_DIR: /data
      OMCPA_DEFAULT_LANGUAGE: zh
      OMCPA_CPA_BASE_URL: http://cpa:8317
      OMCPA_CPA_MANAGEMENT_KEY: ${OMCPA_CPA_MANAGEMENT_KEY:?required}
      OMCPA_MASTER_KEY: ${OMCPA_MASTER_KEY:?required}
      OMCPA_PUBLIC_URL: https://cpa.axoai.cc/omc
      OMCPA_TRUSTED_PROXY_CIDRS: 172.20.0.1/32
      OMCPA_USAGE_INGEST_MODE: subscribe
      OMCPA_UPDATE_CHECK_ENABLED: 'false'
      OMCPA_UPDATE_CHECK_ON_PAGE_LOAD: 'false'
    volumes:
      - oh-my-cpa-data:/data
    restart: unless-stopped

volumes:
  oh-my-cpa-data:
    name: oh-my-cpa-trial-data

networks:
  default:
    name: cpa_default
    external: true
