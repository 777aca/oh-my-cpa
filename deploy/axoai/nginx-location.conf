# Include inside the existing cpa.axoai.cc HTTPS server block.
# Preserve old panel bookmarks after promoting OMC to the root.
location = /management.html {
    return 308 /$is_args$args;
}

location = /omc {
    return 308 /$is_args$args;
}

location ~ ^/omc/(?<omc_legacy_path>.*)$ {
    return 308 /$omc_legacy_path$is_args$args;
}

# Codex Candy Eval v0.4.6: WebKit rejects CSS-connected fonts from another document.
# Font sharing is optional and must not abort plugin startup.
location = /api/v1/plugin-host/v0/resource/plugins/cpa-codex-candy-eval/ui {
    proxy_pass http://127.0.0.1:18317;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_cache off;
    sub_filter_once on;
    sub_filter 'omc?.ownerDocument.fonts?.forEach((face) => document.fonts.add(face));'
               'omc?.ownerDocument.fonts?.forEach((face) => { try { document.fonts.add(face); } catch (error) { if (error.name !== "InvalidModificationError") throw error; } });';
}

# CPA v8.0.71 gateway routes and backend-declared plugin namespaces.
# Keep the existing /bps-batch/ locations in the surrounding server block.
location ~ ^/(v0|v1|v1beta|v8|openai|backend-api|muse-code|healthz|callback|(anthropic|codex|antigravity|devin)/callback)(/|$) {
    proxy_pass http://127.0.0.1:8317;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

location / {
    proxy_pass http://127.0.0.1:18317;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
}
